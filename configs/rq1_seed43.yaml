seed: 43
image_size: 224

paths:
  dataset_root: data/raw/lastframe
  processed_root: data/processed
  output_dir: outputs/validity/rq1_seed_43
  checkpoint_dir: checkpoints/validity/rq1_seed_43

model:
  backbone: resnet50
  pretrained: true

training:
  optimizer: AdamW
  epochs: 5
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 8
  amp: true
  action_loss_weight: 1.0
  rationale_loss_weight: 1.0
  threshold: 0.5

calibration:
  max_iterations: 100

perturbations:
  brightness_factor: 1.10
  blur_radius: 1.0
  noise_std_255: 5.0
  noise_seed: 20260731
