seed: 271828
image_size: 224

paths:
  dataset_root: data/raw/lastframe
  processed_root: data/processed
  output_dir: outputs/validity/seed_271828
  checkpoint_dir: checkpoints/validity/seed_271828

model:
  backbone: resnet50
  pretrained: true

training:
  optimizer: AdamW
  epochs: 10
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 8
  amp: true
  action_loss_weight: 1.0
  rationale_loss_weight: 1.0
  threshold: 0.5

smoke_test:
  train_samples: 256
  validation_samples: 128
  repeated_steps: 4
  batch_size: 32

calibration:
  max_iterations: 100

critical_mask:
  detector: yolo11n.pt
  confidence_threshold: 0.35
  detector_batch_size: 16
  minimum_target_samples: 500
  mask_fill: image_mean

perturbations:
  brightness_factor: 1.10
  blur_radius: 1.0
  noise_std_255: 5.0
  jpeg_quality: 95
  workers: 12
